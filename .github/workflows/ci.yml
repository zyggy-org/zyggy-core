name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y bats shellcheck jq
      - name: bats
        run: bats tests/
        env:
          ZYGGY_HYGIENE_FORBIDDEN: ${{ vars.ZYGGY_HYGIENE_FORBIDDEN }}
      - name: shellcheck
        run: shellcheck -S style .claude/hooks/*.sh .claude/skills/*/*.sh tests/*.bash tests/fixtures/github/gh-stub.sh tests/fixtures/github/git-spy.sh tests/fixtures/graph/curl-stub.sh tests/fixtures/m365/*.sh tests/fixtures/m365/*.bash
      - name: settings.json and .mcp.json parse
        run: jq . .claude/settings.json > /dev/null && jq . .mcp.json > /dev/null
      - name: LF endings only
        run: |
          if git ls-files --eol | grep -v 'i/lf\|i/-text\|i/none'; then
            echo "files above are not LF" >&2
            exit 1
          fi
